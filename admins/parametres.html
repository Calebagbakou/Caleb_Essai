          <div class="form-group">

            <input type="url" id="social_linkedin" placeholder="https://linkedin.com/in/…">
          </div>
          <div class="form-group">
            <label for="social_whatsapp">WhatsApp</label>
            <input type="text" id="social_whatsapp" placeholder="https://wa.me/…">
          </div>

            <label for="social_youtube">YouTube</label>
            <input type="url" id="social_youtube" placeholder="https://youtube.com/…">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/supabase-config.js"></script>
<script src="../assets/supabase-client.js"></script>
<script src="assets/auth.js"></script>
<script>
(async () => {
  const user = await requireAdminSession();
  if (!user) return;
  document.getElementById('whoBox').textContent = user.email;
  document.getElementById('logoutBtn').addEventListener('click', logout);

  const supabase = getSupabase();
  const loadingBox = document.getElementById('loadingBox');
  const errorBox = document.getElementById('errorBox');
  const form = document.getElementById('settingsForm');
  const saveBtn = document.getElementById('saveBtn');
  const saveMsg = document.getElementById('saveMsg');

  const SIMPLE_KEYS = ['site_name', 'logo_url', 'favicon_url', 'contact_email', 'contact_phone', 'shop_url'];
  const SOCIAL_FIELDS = {
    social_facebook: 'facebook',
    social_instagram: 'instagram',
    social_linkedin: 'linkedin',
    social_whatsapp: 'whatsapp',
    social_youtube: 'youtube',
    social_tiktok: 'tiktok',
  };

  async function load(){
    const { data, error } = await supabase.from('settings').select('key, value');
    loadingBox.style.display = 'none';

    if (error){
      console.error(error);
      errorBox.textContent = 'Erreur de chargement : ' + error.message;
      errorBox.style.display = 'block';
      return;
    }

    const map = {};
    for (const row of (data || [])) map[row.key] = row.value;

    for (const key of SIMPLE_KEYS){
      const el = document.getElementById(key);
      if (el && map[key] != null) el.value = map[key];
    }

    const social = map.social_links || {};
    for (const [inputId, socialKey] of Object.entries(SOCIAL_FIELDS)){
      const el = document.getElementById(inputId);
      if (el && social[socialKey]) el.value = social[socialKey];
    }

    form.style.display = 'block';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    saveBtn.disabled = true;
    saveBtn.textContent = 'Enregistrement…';
    saveMsg.textContent = '';
    saveMsg.classList.remove('error');

    const rows = SIMPLE_KEYS.map(key => ({
      key,
      value: document.getElementById(key).value.trim() || null,
    }));

    const social = {};
    for (const [inputId, socialKey] of Object.entries(SOCIAL_FIELDS)){
      const val = document.getElementById(inputId).value.trim();
      if (val) social[socialKey] = val;
    }
    rows.push({ key: 'social_links', value: social });

    const { error } = await supabase.from('settings').upsert(rows, { onConflict: 'key' });

    saveBtn.disabled = false;
    saveBtn.textContent = 'Enregistrer';

    if (error){
      console.error(error);
      saveMsg.textContent = 'Erreur : ' + error.message;
      saveMsg.classList.add('error');
      return;
    }

    saveMsg.textContent = '✓ Paramètres enregistrés.';
    setTimeout(() => { saveMsg.textContent = ''; }, 4000);
  });

  load();
})();
</script>
